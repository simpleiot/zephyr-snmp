# Copied from Zephyr, which is the style this module follows. The typedefs
# file lives in the Zephyr tree rather than here, so it is passed on the
# command line by the caller instead of being named in this file.
--emacs
--summary-file
--show-types
--max-line-length=100
--min-conf-desc-length=1

# The ASN.1 codec propagates errors through PBUF_OP_EXEC, PARSE_EXEC,
# PARSE_ASSERT and BUILD_EXEC, which return from the enclosing function on
# failure. That shorthand is the idiom the whole codec is written around,
# across roughly 150 call sites, so the module keeps it.
--ignore MACRO_WITH_FLOW_CONTROL

--ignore PRINTK_WITHOUT_KERN_LEVEL
--ignore SPLIT_STRING
--ignore VOLATILE
--ignore CONFIG_EXPERIMENTAL
--ignore PREFER_KERNEL_TYPES
--ignore PREFER_SECTION
--ignore AVOID_EXTERNS
--ignore NETWORKING_BLOCK_COMMENT_STYLE
--ignore DATE_TIME
--ignore MINMAX
--ignore CONST_STRUCT
--ignore FILE_PATH_CHANGES
--ignore SPDX_LICENSE_TAG
--ignore C99_COMMENT_TOLERANCE
--ignore REPEATED_WORD
--ignore UNDOCUMENTED_DT_STRING
--ignore DT_SPLIT_BINDING_PATCH
--ignore DT_SCHEMA_BINDING_PATCH
--ignore TRAILING_SEMICOLON
--ignore COMPLEX_MACRO
--ignore MULTISTATEMENT_MACRO_USE_DO_WHILE
--ignore ENOSYS
--ignore IS_ENABLED_CONFIG
--ignore EXPORT_SYMBOL
--ignore COMPARISON_TO_NULL
