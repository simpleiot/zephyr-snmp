# Run the agent on the host's own network stack, for testing without root.
#
# native_sim normally reaches the network through the "zeth" TAP interface,
# which needs root to create. With offloaded sockets the application's socket
# calls go straight to the host instead, so snmpwalk can query the agent over
# the loopback interface. Ports 161 and 162 are privileged, so the agent moves
# to unprivileged ones here.
#
#   west build -b native_sim samples/agent -- -DEXTRA_CONF_FILE=overlay-host.conf
#   ./build/zephyr/zephyr.exe &
#   snmpwalk -v2c -c public localhost:1161 1

CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# Nothing reaches the network through zeth in this configuration, so leave the
# TAP interface alone rather than logging a failure to create it at boot.
CONFIG_ETH_NATIVE_TAP=n

CONFIG_SNMP_AGENT_PORT=1161
CONFIG_SNMP_AGENT_TRAP_PORT=1162

# The host stack provides the addressing.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_NEED_IPV4=n
