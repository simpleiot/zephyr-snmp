CONFIG_SNMP_AGENT=y

# Networking: IPv4 UDP sockets plus the socket service the agent polls with
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y

# inet_addr() and inet_ntoa() come from the POSIX networking layer
CONFIG_POSIX_API=y

# The agent allocates packet buffers with k_malloc()
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_LOG=y

# Static IPv4 address so the sample works on native_sim with the
# net-tools "zeth" interface (host side is 192.0.2.2).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_TEST_RANDOM_GENERATOR=y
